      <script type="application/ld+json" data-prerender="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Can you phase around production?","acceptedAnswer":{"@type":"Answer","text":"Yes — we routinely phase industrial installs around active operations. Most facilities are coated zone by zone over 1-3 weeks, with each zone returning to operation 48 hours after its final coat."}},{"@type":"Question","name":"What chemicals can it handle?","acceptedAnswer":{"@type":"Answer","text":"We spec the topcoat to your exact chemical exposure profile during the consultation. Common exposures: acids, solvents, hydraulic fluids, fuels, food acids, automotive chemicals. Each demands a different topcoat chemistry."}},{"@type":"Question","name":"How long is the lifespan?","acceptedAnswer":{"@type":"Answer","text":"Properly installed industrial systems last 15-25 years with normal maintenance. The spec has to match the use case — a generic commercial floor will not deliver this in industrial use."}},{"@type":"Question","name":"Can you handle thermal cycling and hot processes?","acceptedAnswer":{"@type":"Answer","text":"Yes, with the right chemistry. Spaces with hot oil splash, hot equipment contact, or wide thermal swings get a thermally tolerant urethane mortar system rather than standard epoxy."}},{"@type":"Question","name":"Do you provide EHS and product documentation?","acceptedAnswer":{"@type":"Answer","text":"Yes — full SDS, product data sheets, NSF documentation where applicable, and install records for your EHS files."}}]}</script>
