      <script type="application/ld+json" data-prerender="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How do I pick a flake color?","acceptedAnswer":{"@type":"Answer","text":"We bring physical samples to your consultation so you can compare blends in your actual lighting. Online color photos are not reliable — flake is reflective and reads very differently under garage fluorescents vs. natural light."}},{"@type":"Question","name":"Is flake epoxy good for garages?","acceptedAnswer":{"@type":"Answer","text":"Yes — it's our top-recommended system for residential garages thanks to durability, slip resistance, easy cleanup, and the way it hides slab imperfections under the visual texture of the flake."}},{"@type":"Question","name":"Will the flakes wear off?","acceptedAnswer":{"@type":"Answer","text":"No. Flakes are fully encapsulated inside the epoxy base and the polyaspartic topcoat layers — they're permanently locked in and impossible to scrub or scrape out under normal use."}},{"@type":"Question","name":"How thick is the finished floor?","acceptedAnswer":{"@type":"Answer","text":"About 1/16\" total build, including the base, flake layer, and topcoats. Thick enough to be tough; thin enough that it won't catch on garage door bottom seals or threshold transitions."}},{"@type":"Question","name":"Can flake epoxy go over a previous coating?","acceptedAnswer":{"@type":"Answer","text":"Sometimes. We test adhesion of the existing coating and check for moisture issues. If the old coating is bonded and the slab is dry, we can re-prep and re-coat — otherwise full removal."}}]}</script>
