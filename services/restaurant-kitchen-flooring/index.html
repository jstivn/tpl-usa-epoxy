      <script type="application/ld+json" data-prerender="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Will floors meet health code?","acceptedAnswer":{"@type":"Answer","text":"Yes — our quartz kitchen systems meet sanitation requirements for commercial food service. We provide product data sheets for your inspector documenting NSF compliance."}},{"@type":"Question","name":"Can you install around equipment?","acceptedAnswer":{"@type":"Answer","text":"Yes, we work around fixed equipment and detail every edge, drain, and pipe penetration. Removable equipment is moved during install so the floor under it is fully coated."}},{"@type":"Question","name":"How fast can the kitchen reopen?","acceptedAnswer":{"@type":"Answer","text":"Most restaurant kitchens reopen 24-48 hours after final cure. We schedule installs around your closures so the reopen lines up with your normal service start."}},{"@type":"Question","name":"Do I need integral cove base?","acceptedAnswer":{"@type":"Answer","text":"Strongly recommended for full sanitation compliance and for kitchens that wash down with hoses. It eliminates the floor-wall seam where grease and bacteria collect. It's an optional add but most restaurants spec it."}},{"@type":"Question","name":"How does this compare to quarry tile?","acceptedAnswer":{"@type":"Answer","text":"Quarry tile has grout lines that absorb grease, harbor bacteria, and require constant re-grouting. Seamless quartz epoxy has none of that, costs less to install for equivalent durability, and cleans faster at end of night."}}]}</script>
