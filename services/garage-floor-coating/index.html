      <script type="application/ld+json" data-prerender="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Do I need to empty my garage first?","acceptedAnswer":{"@type":"Answer","text":"Yes — please clear everything out the night before so we can access the entire slab. We'll send a checklist after booking."}},{"@type":"Question","name":"When can I park on my new floor?","acceptedAnswer":{"@type":"Answer","text":"Foot traffic same day. Vehicles 24 hours after final topcoat cure. Hot tires (long highway drive) are fine after 72 hours for full chemical cure."}},{"@type":"Question","name":"What if my concrete is cracked?","acceptedAnswer":{"@type":"Answer","text":"We repair cracks with semi-rigid polyurea during prep before the coating goes down. Most static cracks are completely invisible in the finished floor; active cracks need a control joint that we cut and detail."}},{"@type":"Question","name":"Flake or metallic — which is better for a garage?","acceptedAnswer":{"@type":"Answer","text":"Flake is the right choice for almost every working garage — slip resistance, durability, hides imperfections. Metallic is the right choice for show garages and finished spaces where the floor is the visual centerpiece and the car doesn't live there full-time."}},{"@type":"Question","name":"How is your install different from a roll-on kit from a hardware store?","acceptedAnswer":{"@type":"Answer","text":"Three things: we diamond-grind to a real profile (kits use acid etch, which is not a profile), we use 100% solids epoxy and polyaspartic instead of water-based product, and our topcoat is UV-stable and hot-tire-rated. A kit lasts a season; a real install lasts decades."}}]}</script>
