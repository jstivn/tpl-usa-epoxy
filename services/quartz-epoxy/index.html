      <script type="application/ld+json" data-prerender="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is quartz epoxy NSF compliant for kitchens?","acceptedAnswer":{"@type":"Answer","text":"Our quartz systems with the correct topcoat meet NSF sanitation standards required for commercial kitchens and food-prep areas. We'll spec the exact buildup and provide product data sheets for your inspector."}},{"@type":"Question","name":"How slip-resistant is quartz?","acceptedAnswer":{"@type":"Answer","text":"Quartz delivers the highest slip resistance of any system we offer — the broadcast aggregate creates real mechanical traction, and we can dial it further with additional aggregate or anti-slip additives in the topcoat."}},{"@type":"Question","name":"Can quartz be installed outside?","acceptedAnswer":{"@type":"Answer","text":"Yes — quartz is excellent for pool decks and patios with a UV-stable polyaspartic topcoat. We spec the outdoor variant by default for any sun-exposed install."}},{"@type":"Question","name":"How thick does quartz build?","acceptedAnswer":{"@type":"Answer","text":"Single broadcast: about 1/8\" total. Double broadcast for heavy industrial or NSF work: 1/4\" total. We match the build to the use case and load."}},{"@type":"Question","name":"Is quartz harder to repair than flake?","acceptedAnswer":{"@type":"Answer","text":"Slightly. Spot repairs blend less seamlessly because the aggregate is more visible. For most commercial settings we recommend an annual or biennial topcoat refresh that masks any wear and keeps the floor looking new for decades."}}]}</script>
