      <script type="application/ld+json" data-prerender="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Will pool chemicals damage the coating?","acceptedAnswer":{"@type":"Answer","text":"No — our quartz topcoat is engineered to resist chlorine, bromine, and salt systems. We've coated salt-system pool decks running at full chemistry for years without finish degradation."}},{"@type":"Question","name":"How hot does the surface get?","acceptedAnswer":{"@type":"Answer","text":"Untreated, a dark coating in full Texas sun can hit 140°F on summer afternoons. We offer cool-touch additives that drop surface temperature 10-15°F and keep deck surfaces comfortable for bare feet."}},{"@type":"Question","name":"How long is install?","acceptedAnswer":{"@type":"Answer","text":"Most residential pool decks are completed in 2-3 days. The pool stays usable during prep; we tape coping carefully and most decks can be re-entered for swim within 72 hours of the final coat."}},{"@type":"Question","name":"Can you coat around a hot tub and outdoor kitchen?","acceptedAnswer":{"@type":"Answer","text":"Yes — we routinely detail around hot tubs, outdoor kitchens, and water features, with clean termination lines and matching finishes if you want the kitchen surround coated too."}},{"@type":"Question","name":"Will the coating peel from pool overspray?","acceptedAnswer":{"@type":"Answer","text":"Not when installed correctly. The moisture-tolerant primer is the key — it bonds even with the splash and drainage exposure typical of pool decks, which is why generic interior epoxy systems fail outdoors."}}]}</script>
