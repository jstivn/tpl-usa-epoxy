  <body>
    <div id="root"></div>
  <script>(function(){
  function ready(fn){ if(document.readyState!=="loading"){ fn(); } else { document.addEventListener("DOMContentLoaded", fn); } }
  ready(function(){
    var form = document.querySelector('form');
    if(!form || form.__icBound) return;
    form.__icBound = true;
    var nameEl = document.getElementById('contact-name');
    var phoneEl = document.getElementById('contact-phone');
    var emailEl = document.getElementById('contact-email');
    var msgEl = document.getElementById('contact-message');
    var hp = form.querySelector('input[aria-hidden]');
    var btn = form.querySelector('button[type="submit"], button');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(hp && hp.value){ swapSuccess(); return; }
      var name = (nameEl && nameEl.value || '').trim();
      var email = (emailEl && emailEl.value || '').trim();
      if(!name || !email) return;
      var sp = name.indexOf(' ');
      var first_name = sp === -1 ? name : name.slice(0, sp);
      var last_name = sp === -1 ? '' : name.slice(sp+1).trim();
      if(btn){ btn.disabled = true; btn.textContent = 'Sending...'; }
      fetch('/api/lead-router', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          source: 'iron-coat',
          first_name: first_name,
          last_name: last_name,
          email: email,
          phone: (phoneEl && phoneEl.value || '').trim(),
          message: (msgEl && msgEl.value || '').trim()
        })
      }).then(function(r){ if(!r.ok) throw new Error('http'); swapSuccess(); })
        .catch(function(){ showError(); if(btn){ btn.disabled = false; btn.textContent = 'Send Message'; } });
    });
    function swapSuccess(){
      var wrap = form.parentNode;
      wrap.innerHTML = '<div style="text-align:center;padding:40px 20px"><h2 style="font-family:Oswald,sans-serif;text-transform:uppercase;font-size:28px;margin:0 0 12px">Thanks — we\'ve got it.</h2><p style="color:#666;margin:0 0 20px">Trevor will be in touch shortly. For the fastest response:</p><a href="tel:+12145550199" style="display:inline-block;background:#c8102e;color:#fff;padding:14px 28px;text-decoration:none;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;border-radius:6px">Call (214) 555-0199</a></div>';
    }
    function showError(){
      var existing = form.querySelector('.ic-err');
      if(existing) return;
      var d = document.createElement('div');
      d.className = 'ic-err';
      d.style.cssText = 'margin-top:16px;padding:14px;border:1px solid #c8102e;border-radius:6px;color:#c8102e;font-size:14px';
      d.innerHTML = 'Something went wrong sending your message. Please reach us directly: <br><a href="tel:+12145550199" style="color:#c8102e;font-weight:700">(214) 555-0199</a> &middot; <a href="mailto:contact@apexepoxy.com" style="color:#c8102e;font-weight:700">contact@apexepoxy.com</a>';
      form.appendChild(d);
    }
  });
})();</script>
